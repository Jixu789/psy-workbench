      { t:"适应需要三样东西", b:["一个可以说话的人","一条熟悉的路线（教室—食堂—宿舍）","一件擅长的小事，用来找回掌控感"] },
      { t:"什么时候需要求助", b:["持续两周以上情绪低落、失眠","完全无法上课或进食","出现伤害自己的想法——立刻找成年人"] },
    ],
    act:{ t:"我的第一周地图", b:["在纸上画出教室、食堂、宿舍、心理室","标出三个「可以求助的人」的位置","和同桌交换，补上对方不知道的地方","把地图拍照存进手机"] },
    case:{ t:"熄灯后的第一个晚上", b:["场景：新宿舍，谁都不认识，睡不着","他脑子里在反复想什么","第二天可以主动做的第一件小事","室友其实可能也在紧张"] },
    skills:["先建立「最小日常」：固定吃饭、固定作息","主动开口一次，比等别人来找更容易","把大目标拆成今天能做的一件小事"],
    relax:["躺下后，从脚趾到额头逐段放松","回忆一个让自己安心的场景，停留 1 分钟","对自己说：不熟悉，只是暂时的","明天起床后，先做一件确定能做好的事"],
    ext:["本周认识一位新同学，记住名字","把「第一周地图」贴在书桌上","写一段给一个月后自己的话"],
    sum:["不适应说明你在认真生活","先找一个人、一条路线、一件小事","持续两周不好转，就去找人帮忙"],
  },
  "生涯规划": {
    tag:"先认识自己，再谈要去哪里",
    goals:["说出兴趣、能力、价值三条线索","知道选科与未来职业不是一次性决定","完成一份自己的「兴趣—能力」清单"],
    points:[
      { t:"认识自己的三条线索", b:["兴趣：做什么事时会忘记时间","能力：别人常找你帮什么忙","价值：你最不能妥协的是什么"] },
      { t:"选科不是终身判决", b:["它影响路径，但不决定人生","多数专业对选科的要求在逐步放宽","保留调整空间，比一次选对更重要"] },
      { t:"信息从哪里来", b:["学校生涯课、班主任、学长学姐","官方招生简章与专业目录","实地体验：开放日、职业访谈"] },
    ],
    act:{ t:"兴趣—能力四格", b:["画一个四格：喜欢且擅长 / 喜欢不擅长 / 擅长不喜欢 / 都不确定","把自己最近一年做过的 8 件事填进去","找出「喜欢且擅长」里的关键词","和同桌交换，互相补一条观察"] },
    case:{ t:"她说「我爸妈想让我学医」", b:["场景：她对生物没兴趣，但家里已经定了方向","她真正担心的是什么","可以怎样和父母谈，而不是对抗","哪些信息能帮助这场对话"] },
    skills:["用「小步试错」代替「一次决定」","把「我想成为谁」换成「我想解决什么问题」","做决定前，先找 2 个真实的人聊聊"],
    relax:["闭眼想象 5 年后的一个普通工作日","注意场景里的三个细节","问自己：那时我在做什么、和谁一起","睁眼，写下一件现在就能靠近它的小事"],
    ext:["访谈一位从事你感兴趣职业的成年人","整理 3 个目标专业对选科的要求","写一份 300 字的「我的三年计划」"],
    sum:["兴趣、能力、价值，缺一不可","选科影响路径，不决定人生","用小步试错，代替一次押注"],
  },
};

function pptTopicData(name){
  if(PPT_TOPICS[name]) return PPT_TOPICS[name];
  const n = name || "心理课";
  return {
    tag:n + "：从现象到方法，一节课只讲透一件事",
    goals:["说出「"+n+"」在生活中的常见表现","识别自己在其中的真实感受与需要","带走 2 个可以马上用的方法"],
    points:[
      { t:"它从哪里来", b:["先从最近一次真实经历说起","把现象和原因分开看，不急着下结论","承认感受是合理的，再谈改变"] },
      { t:"它如何影响我们", b:["影响注意力：心里有事时很难听进去","影响身体：睡不好、吃不下、坐不住","影响关系：容易把情绪发到最亲的人身上"] },
      { t:"我们可以做什么", b:["先停下来：离开现场 2 分钟","把感受说出来：用一个词命名它","选一个小动作：呼吸、喝水、找人聊"] },
    ],
    act:{ t:"一分钟小调查", b:["匿名写下最近一次相关的经历（只写事实）","折起来放进盒子，随机抽三张读出来","全班猜：如果是你，会怎么回应","老师只做归纳，不点评个人"] },
    case:{ t:"一个真实的场景", b:["场景：事情发生的那一刻，他做了什么","他没说出口的那句话是什么","如果你是旁边的人，第一句话说什么","哪些回应会让事情变得更糟"] },
    skills:["先处理情绪，再处理问题","把「你总是」换成「我感到…因为…我希望…」","给对方一个台阶，也给自己一个出口"],
    relax:["坐直，双脚踩地，肩膀放松","吸气 4 秒、屏息 7 秒、呼气 8 秒，做 4 轮","把注意力放到脚底与椅面接触的感觉上","睁眼，说出此刻看到的 3 样东西"],
    ext:["本周记录 3 次相关情境与自己的反应","找一个信任的人聊 10 分钟","下周带来一个自己试过、有效的办法"],
    sum:["感受是真实的，行为可以重新选择","先说感受，再说请求","需要帮助时，开口不是软弱"],
  };
}

function pptState(){
  if(!data.__ppt || typeof data.__ppt!=="object"){
    data.__ppt = { topic:"情绪管理", grade:"初二", minutes:40, theme:"warm", notes:true, toPlan:true };
  }
  return data.__ppt;
}

/* 15 页结构与标题（随主题变化） */
function pptOutline(st){
  const c = pptTopicData(st.topic);
  return [
    "封面 · " + st.topic,
    "本课目标",
    "暖身导入",
    c.points[0].t,
    c.points[1].t,
    c.points[2].t,
    "体验活动 · " + c.act.t,
    "案例讨论 · " + c.case.t,
    "三个可以马上用的方法",
    "一起做一次放松练习",
    "课堂小结",
    "课后延伸",
    "求助资源",
    "时间分配（讲师页）",
    "结束页",
  ];
}

function pptOutlineHTML(html){
  return html.map(t=>`<div class="ppt-line"><i></i><span>${esc(t)}</span></div>`).join("");
}

function ppBuildDeck(st){
  const T = PPT_THEMES[st.theme] || PPT_THEMES.warm;
  const c = pptTopicData(st.topic);
  const F = "微软雅黑";
  const W = 13.333, H = 7.5, M = 0.95;
  const pptx = new PptxGenJS();
  pptx.layout = "LAYOUT_WIDE";
  pptx.title = st.topic + " · " + st.grade;
  pptx.author = "心理老师工作台";

  const newSlide = () => { const s = pptx.addSlide(); s.background = { color:T.bg }; return s; };
  const foot = (s, i) => {
    s.addText("心理老师工作台 · 一键出课件", { x:M, y:H-0.52, w:6, h:0.25, fontFace:F, fontSize:9, color:T.ink2 });
    s.addText(String(i).padStart(2,"0"), { x:W-M-0.6, y:H-0.55, w:0.6, h:0.3, fontFace:F, fontSize:11, color:T.ink2, align:"right" });
  };
  const head = (s, en, title) => {
    s.addShape(pptx.ShapeType.rect, { x:M, y:0.95, w:0.46, h:0.1, fill:{ color:T.accent }, line:{ color:T.accent } });
    s.addText(en, { x:M+0.6, y:0.85, w:6, h:0.28, fontFace:F, fontSize:10, color:T.ink2, charSpacing:2 });
    s.addText(title, { x:M, y:1.3, w:W-2*M, h:0.85, fontFace:F, fontSize:30, bold:true, color:T.ink, valign:"middle" });
  };
  const items = (s, list, y0, size, gap) => {
    list.forEach((t,i)=>{
      const y = y0 + i*(gap||1.02);
      s.addShape(pptx.ShapeType.rect, { x:M+0.02, y:y+0.15, w:0.17, h:0.17, fill:{ color:T.accent }, line:{ color:T.accent } });
      s.addText(t, { x:M+0.45, y, w:W-2*M-0.55, h:(gap||1.02)-0.12, fontFace:F, fontSize:size||17, color:T.ink, lineSpacing:size*1.6, valign:"top" });
    });
  };
  const note = (s, txt) => { if(st.notes) s.addNotes(txt); };

  /* 01 封面 */
  {
    const s = newSlide();
    s.addShape(pptx.ShapeType.rect, { x:W-3.6, y:0, w:3.6, h:H, fill:{ color:T.soft }, line:{ color:T.soft } });
    s.addShape(pptx.ShapeType.rect, { x:W-3.6, y:0, w:0.14, h:H, fill:{ color:T.accent }, line:{ color:T.accent } });
    s.addText("心理课 · " + st.grade, { x:M, y:1.55, w:6, h:0.32, fontFace:F, fontSize:12, color:T.ink2, charSpacing:3 });
    s.addText(st.topic, { x:M, y:2.05, w:W-2*M-1.5, h:1.5, fontFace:F, fontSize:50, bold:true, color:T.ink, valign:"middle" });
    s.addText(c.tag, { x:M, y:3.7, w:W-2*M-1.5, h:0.6, fontFace:F, fontSize:17, color:T.ink2 });
    s.addShape(pptx.ShapeType.rect, { x:M, y:4.65, w:2.2, h:0.05, fill:{ color:T.accent }, line:{ color:T.accent } });
    s.addText([{ text:"时长 ", options:{ color:T.ink2 } }, { text:st.minutes+" 分钟", options:{ color:T.ink, bold:true } },
                { text:"　·　页数 ", options:{ color:T.ink2 } }, { text:"15 页", options:{ color:T.ink, bold:true } },
                { text:"　·　配色 ", options:{ color:T.ink2 } }, { text:T.nm, options:{ color:T.ink, bold:true } }],
      { x:M, y:4.95, w:W-2*M, h:0.4, fontFace:F, fontSize:13 });
    foot(s, 1);
    note(s, "开场 1 分钟：一句话说明今天要解决的一个具体问题，不铺垫太长。\n提醒学生：本课不需要公开自己的隐私，可以只说「我观察到」。" );
  }

  /* 02 目标 */
  {
    const s = newSlide(); head(s, "OBJECTIVES", "这节课，我们想做到三件事");
    items(s, c.goals, 2.55, 18, 1.1);
    foot(s, 2);
    note(s, "把目标读一遍即可，不用展开。\n讲完可以问一句：这三条里，你最想带走哪一条？举手看一下分布。" );
  }

  /* 03 暖身 */
  {
    const s = newSlide(); head(s, "WARM UP", "先热个身：三个小问题");
    items(s, ["最近一周，你因为「"+st.topic+"」烦过吗？（举手即可，不用说明）","当时身体的哪个部位最有反应？","你已经试过什么办法？管用吗？"], 2.5, 17, 1.15);
    s.addText("规则：只说自己，不评价别人；不想说可以跳过。", { x:M, y:6.1, w:W-2*M, h:0.35, fontFace:F, fontSize:12, color:T.ink2 });
    foot(s, 3);
    note(s, "3 到 5 分钟。举手统计比逐个点名更安全。\n如果有学生说得很多，接住一句就转到下一个问题，避免变成个案辅导。" );
  }

  /* 04-06 知识点 */
  c.points.forEach((p, i) => {
    const s = newSlide(); head(s, "KEY " + (i+1), p.t);
    items(s, p.b, 2.55, 17, 1.15);
    foot(s, 4+i);
    note(s, i===0 ? "这一页是全场的地基，慢一点，举一个班里的通用例子（不要指向具体学生）。"
        : i===1 ? "重点让学生自己说出身体信号，老师只做归纳。可以请两三位同学补充。"
        : "三种方法里，至少带全班现场做一次呼吸，不要只讲。" );
  });

  /* 07 活动 */
  {
    const s = newSlide(); head(s, "ACTIVITY", c.act.t);
    items(s, c.act.b, 2.5, 16, 1.0);
    foot(s, 7);
    note(s, "8 到 12 分钟。提前说清规则与边界：可以只写事实，不写姓名。\n活动结束后留 1 分钟安静，让情绪落地再进下一环节。" );
  }

  /* 08 案例 */
  {
    const s = newSlide(); head(s, "CASE", c.case.t);
    items(s, c.case.b, 2.5, 16, 1.0);
    foot(s, 8);
    note(s, "案例必须是虚构或高度改写的，不能指向本班学生。\n讨论时把「他会怎么想」放在「他做得对不对」之前。" );
  }

  /* 09 方法 */
  {
    const s = newSlide(); head(s, "SKILLS", "三个可以马上用的方法");
    items(s, c.skills, 2.6, 18, 1.15);
    foot(s, 9);
    note(s, "每个方法配一句「什么时候用」。\n请学生选一个，写在书页角上，作为本周的小实验。" );
  }

  /* 10 放松 */
  {
    const s = newSlide(); head(s, "PRACTICE", "一起做一次放松练习");
    items(s, c.relax, 2.45, 17, 0.98);
    s.addText("全程约 3 分钟 · 可以闭眼，也可以看着桌面", { x:M, y:6.45, w:W-2*M, h:0.32, fontFace:F, fontSize:12, color:T.ink2 });
    foot(s, 10);
    note(s, "语速放慢到平时的一半，每句之间停 2 秒。\n不要触碰学生身体；有学生不愿闭眼，允许睁眼看向桌面。" );
  }

  /* 11 小结 */
  {
    const s = newSlide(); head(s, "SUMMARY", "带走三句话");
    items(s, c.sum, 2.6, 19, 1.15);
    foot(s, 11);
    note(s, "请三位同学各读一句，比老师自己念更有代入感。\n最后一句停两秒再翻页。" );
  }

  /* 12 延伸 */
  {
    const s = newSlide(); head(s, "HOMEWORK", "课后可以做的三件小事");
    items(s, c.ext, 2.55, 17, 1.15);
    foot(s, 12);
    note(s, "强调「三选一」而不是「都要做」，降低负担。\n下周课前用 2 分钟回收，别让它变成空作业。" );
  }

  /* 13 资源 */
  {
    const s = newSlide(); head(s, "SUPPORT", "需要帮助时，可以找谁");
    items(s, [
      "学校心理老师 / 班主任（工作日都可以找）",
      "全国心理援助热线 12356（24 小时）",
      "青少年服务热线 12355",
      "紧急危险：110 / 120，先保证安全",
    ], 2.45, 17, 0.98);
    s.addText("求助不是软弱，是把问题交给更有能力处理的人。", { x:M, y:6.42, w:W-2*M, h:0.34, fontFace:F, fontSize:12.5, color:T.ink, bold:true });
    foot(s, 13);
    note(s, "这一页必须讲，不能跳。\n把本校心理室的位置与开放时间写在黑板上，比念号码更有用。" );
  }

  /* 14 时间分配（讲师页） */
  {
    const s = newSlide(); head(s, "FOR TEACHER", "时间分配建议（" + st.minutes + " 分钟）");
    const seg = [["暖身导入",0.12],["知识点讲解",0.30],["体验活动",0.28],["案例讨论",0.20],["小结与延伸",0.10]]
      .map(([n,r])=>[n, Math.max(2, Math.round(st.minutes*r))+" 分钟"]);
    items(s, seg.map(([n,t])=>n + "　—　" + t), 2.4, 16, 0.8);
    s.addText("本页为讲师页，放映时可右键「隐藏幻灯片」。", { x:M, y:6.55, w:W-2*M, h:0.3, fontFace:F, fontSize:12, color:T.ink2 });
    foot(s, 14);
    note(s, "实际课堂常被突发事件打断，宁可少讲一个知识点，也要把活动和放松做完。" );
  }

  /* 15 结束 */
  {
    const s = newSlide();
    s.addShape(pptx.ShapeType.rect, { x:0, y:H-1.35, w:W, h:1.35, fill:{ color:T.soft }, line:{ color:T.soft } });
    s.addText("谢谢", { x:M, y:2.4, w:W-2*M, h:1.2, fontFace:F, fontSize:54, bold:true, color:T.ink, valign:"middle" });
    s.addText("愿你和你的学生，都被好好接住。", { x:M, y:3.75, w:W-2*M, h:0.5, fontFace:F, fontSize:18, color:T.ink2 });
    s.addText("心理老师工作台 · " + T.nm, { x:M, y:H-0.95, w:W-2*M, h:0.35, fontFace:F, fontSize:12, color:T.ink2 });
    note(s, "留 30 秒安静收尾，不急着下课。\n如果有人在课上被触动，课后单独找他一分钟。" );
  }

  return pptx;
}

/* ---------- 页面 ---------- */
function renderPpt(){
  const st = pptState();
  const grades = ["初一","初二","初三","高一","高二","高三"];
  const mins = [20,40,45];
  const chips = Object.keys(PPT_TOPICS).map(k=>
    `<div class="ppt-chip ${k===st.topic?"on":""}" data-topic="${attr(k)}">${esc(k)}</div>`).join("");
  const segHTML = (arr, cur, cls) => arr.map(v=>
    `<div class="opt ${String(v)===String(cur)?"on":""}" data-v="${attr(String(v))}">${esc(String(v))}</div>`).join("");
  const swHTML = Object.keys(PPT_THEMES).map(k=>{
    const t=PPT_THEMES[k];
    return `<div class="ppt-sw ${k===st.theme?"on":""}" data-theme="${k}">
      <div class="bar" style="background:linear-gradient(90deg,#${t.bg} 0%,#${t.soft} 55%,#${t.accent} 100%)"></div>
      <div class="nm">${esc(t.nm)}</div><div class="dsc">${k==="warm"?"暖米底 · 适合日常":k==="mint"?"浅绿底 · 适合成长主题":"深蓝底 · 适合晚课"}</div></div>`;
  }).join("");

  $("#screen").innerHTML = `
    <div class="header"><div><h2>一键出课件</h2><p>选主题与配色，浏览器内直接生成 15 页 PPTX（已内嵌，无需联网）</p></div>
      <div class="spacer"></div><span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
    <div class="ppt-wrap">
      <div class="ppt-card">
        <h3>${icon("bolt",17)} 课程设置 <span class="en">SETUP</span></h3>
        <div class="field">
          <label>课程主题</label>
          <input id="ppt-topic" value="${attr(st.topic)}" placeholder="例如：情绪管理" style="width:100%"/>
          <div class="ppt-chips" id="ppt-chips">${chips}</div>
        </div>
        <div class="frow">
          <div class="field"><label>学段</label><div class="seg" id="ppt-grade">${segHTML(grades, st.grade)}</div></div>
          <div class="field"><label>时长（分钟）</label><div class="seg" id="ppt-min">${segHTML(mins, st.minutes)}</div></div>
        </div>
        <div class="field"><label>配色</label><div class="ppt-swatch" id="ppt-theme">${swHTML}</div></div>
        <label class="ppt-toggle"><input type="checkbox" id="ppt-notes" ${st.notes?"checked":""}/> 生成讲师备注（放映时在「演示者视图」可见）</label>
        <label class="ppt-toggle"><input type="checkbox" id="ppt-toplan" ${st.toPlan?"checked":""}/> 生成后自动记入「课程排期」</label>
        <div class="ppt-actions">
          <button class="btn" id="ppt-gen">一键生成 PPTX</button>
          <span class="ppt-state" id="ppt-state"></span>
        </div>
        <div class="ppt-note">生成后会自动下载到浏览器的下载目录，文件名形如「初二_情绪管理_课件.pptx」。<br/>预设 6 个主题有专属内容；自己输入的主题会套用通用结构，仍可直接改文案。</div>
      </div>
      <div class="ppt-card">
        <h3>${icon("book",17)} 大纲预览 <span class="en">OUTLINE</span></h3>
        <div class="ppt-outline" id="ppt-outline">${pptOutlineHTML(pptOutline(st))}</div>
        <div class="ppt-note" id="ppt-meta">15 页 · 16:9 · ${PPT_THEMES[st.theme].nm} · ${st.notes?"含讲师备注":"不含备注"}</div>
      </div>
    </div>`;

  const sync = () => {
    $("#ppt-outline").innerHTML = pptOutlineHTML(pptOutline(st));
    $("#ppt-meta").textContent = `15 页 · 16:9 · ${PPT_THEMES[st.theme].nm} · ${st.notes?"含讲师备注":"不含备注"}`;
    $("#ppt-chips").querySelectorAll("[data-topic]").forEach(el=>el.classList.toggle("on", el.dataset.topic===st.topic));
    store.save();
  };
  $("#ppt-topic").addEventListener("input", e => { st.topic = e.target.value.trim(); sync(); });
  $("#ppt-chips").querySelectorAll("[data-topic]").forEach(el=>el.onclick=()=>{
    st.topic = el.dataset.topic; $("#ppt-topic").value = st.topic; sync();
  });
  $("#ppt-grade").querySelectorAll(".opt").forEach(el=>el.onclick=()=>{
    st.grade = el.dataset.v; $("#ppt-grade").querySelectorAll(".opt").forEach(o=>o.classList.toggle("on", o===el)); sync();
  });
  $("#ppt-min").querySelectorAll(".opt").forEach(el=>el.onclick=()=>{
    st.minutes = +el.dataset.v; $("#ppt-min").querySelectorAll(".opt").forEach(o=>o.classList.toggle("on", o===el)); sync();
  });
  $("#ppt-theme").querySelectorAll("[data-theme]").forEach(el=>el.onclick=()=>{
    st.theme = el.dataset.theme; $("#ppt-theme").querySelectorAll("[data-theme]").forEach(o=>o.classList.toggle("on", o===el)); sync();
  });
  $("#ppt-notes").onchange = e => { st.notes = e.target.checked; sync(); };
  $("#ppt-toplan").onchange = e => { st.toPlan = e.target.checked; store.save(); };
  $("#ppt-gen").onclick = () => pptGenerate();
}

async function pptGenerate(){
  const st = pptState();
  const btn = $("#ppt-gen"), out = $("#ppt-state");
  if(!st.topic) st.topic = "情绪管理";
  const set = (msg, cls) => { out.textContent = msg; out.className = "ppt-state" + (cls?(" "+cls):""); };
  btn.disabled = true; set("正在生成，请稍等…");
  try{
    if(typeof PptxGenJS === "undefined") throw new Error("PPT 引擎未加载");
    const pptx = ppBuildDeck(st);
    const safe = st.topic.replace(/[\\/:*?"<>|]/g, "");
    const fileName = `${st.grade}_${safe}_课件.pptx`;
    await pptx.writeFile({ fileName });
    let extra = "";
    if(st.toPlan && pptAddPlan(st)) extra = "　已记入课程排期";
    set("已生成 " + fileName + "，在浏览器下载栏查看" + extra, "ok");
  }catch(err){
    set("生成失败：" + (err && err.message ? err.message : err), "err");
  }finally{
    btn.disabled = false;
  }
}

function pptAddPlan(st){
  data.plan = data.plan || [];
  const title = `${st.grade} · ${st.topic}（一键生成）`;
  if(data.plan.some(x=>x.title===title)) return false;
  data.plan.unshift({ id:Date.now(), title, content:`${st.minutes} 分钟 / 15 页 / ${PPT_THEMES[st.theme].nm}配色 / PPTX 已生成`, mood:"待上", date:isoToday() });
  store.save();
  return true;
}

buildNav();
render();
</script>
</body>
</html>
